name: Build Windows Installer
 
# Läuft auf einem echten Windows-Server bei GitHub (windows-latest) — nicht
# simuliert. Das ist wichtig, weil native Module (better-sqlite3, @napi-rs/canvas)
# für Windows gebaut/geladen werden müssen; das geht von macOS/Linux aus nicht
# zuverlässig.
#
# - Push eines Tags "v*" (z. B. v1.0.0): baut den Installer UND veröffentlicht
#   ihn automatisch als Anhang an eine neue GitHub Release.
# - Manuell über "Run workflow" im Actions-Tab: baut den Installer nur als
#   herunterladbares Workflow-Artefakt (zum Testen, ohne gleich eine Release
#   anzulegen).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}
 
permissions:
  contents: write
 
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Install dependencies
        run: npm install
 
      # electron-builder veröffentlicht standardmäßig an eine Release mit dem Tag
      # "v<package.json-Version>" — ohne diesen Schritt landet die .exe an einer
      # anderen (ggf. neu angelegten) Release als der, die den Build ausgelöst hat.
      - name: Versionsnummer aus dem Git-Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
 
      - name: Regressionstests
        run: npm test
 
      - name: Frontend bauen
        run: npm run build
 
      - name: Native Module gegen Electrons ABI neu bauen
        run: npm run rebuild:electron
 
      - name: Installer bauen und an GitHub Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Installer bauen (nur Artefakt, kein Tag-Push)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win --publish never
 
      - name: Installer als Workflow-Artefakt hochladen
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: erschliessung-windows-installer
          path: release/*.exe
 
